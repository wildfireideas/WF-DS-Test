<title>Jackson Supply Wireframes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: prototype chrome (toolbar + notes rail) around a resizable "site" frame; the site uses container queries so the Mobile toggle shows true small-screen layouts. Single light theme on purpose: wireframes read as paper. */
:root {
  --paper: #ffffff;
  --desk: #e9ebee;
  --ink: #16191d;
  --g1: #f3f4f6;
  --g2: #e2e5e9;
  --g3: #c4c9cf;
  --g4: #8a929b;
  --g5: #545b63;
  --note: #2f62d6;
  --note-bg: #eaf0fd;
  --ok: #2d7a4a;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--desk); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.5; margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--note); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- Prototype chrome ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
.proto-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--ink); color: #fff; font-family: var(--mono); font-size: 12.5px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.proto-bar .name { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.proto-bar .name small { color: #9aa3ad; font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 6px; }
.proto-bar label { display: inline-flex; align-items: center; gap: 8px; color: #c8cdd3; }
.proto-bar select { background: #2a2f36; color: #fff; border: 1px solid #3c434c; border-radius: 4px; padding: 5px 8px; max-width: 62vw; }
.seg { display: inline-flex; border: 1px solid #3c434c; border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: #c8cdd3; padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
.proto-bar .spacer { flex: 1; }

.proto { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start;
  padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proto.no-notes { grid-template-columns: minmax(0, 1fr); }
.proto.no-notes .rail { display: none; }
@media (max-width: 1080px) { .proto { grid-template-columns: minmax(0, 1fr); } }
.stage { min-width: 0; display: flex; justify-content: center; }
.device { width: 100%; max-width: 1280px; transition: max-width .25s ease; }
.device.mobile { max-width: 390px; }
.device-label { font-family: var(--mono); font-size: 11.5px; color: var(--g5); display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.site { container-type: inline-size; container-name: site; background: var(--paper); border: 1px solid var(--g3); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(20,30,40,.08); position: relative; overflow: hidden; }
.device.mobile .site { border-radius: 28px; border-width: 8px; border-color: var(--ink); }

.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); font-size: 13.5px; min-width: 0; }
.rail h2 { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--g5); margin: 0 0 4px; font-weight: 600; }
.rail .pg { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
.rail .tpl { font-family: var(--mono); font-size: 11.5px; color: var(--g5); margin: 0 0 14px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rail li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; background: var(--paper); border: 1px solid var(--g2); border-radius: 6px; padding: 10px 12px; }
.rail li b { display: block; font-size: 13px; }
.rail li > div > span { color: var(--g5); display: block; }
.rail .legend { margin-top: 16px; font-family: var(--mono); font-size: 11.5px; color: var(--g5); line-height: 1.6; }

.pin { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--note); color: #fff;
  font: 600 11.5px/1 var(--mono); flex: none; vertical-align: middle; box-shadow: 0 0 0 3px rgba(47,98,214,.18); }
.pin-abs { position: absolute; top: 10px; right: 10px; z-index: 3; }
.no-pins .site .pin { display: none; }

/* ---------- Wireframe primitives ---------- */
.site { font-size: 15px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }
@container site (max-width: 760px) { .wrap { padding-left: 16px; padding-right: 16px; } }
.sec { padding-block: 56px; position: relative; }
.sec.tight { padding-block: 32px; }
.sec.tint { background: var(--g1); }
.sec.dark { background: var(--g5); color: #fff; }
@container site (max-width: 760px) { .sec { padding-block: 36px; } }
.eyebrow { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--g5); margin: 0 0 8px; font-weight: 500; }
.dark .eyebrow { color: #dfe3e7; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -.01em; }
.h1 { font-size: 46px; font-weight: 800; }
.h2 { font-size: 30px; font-weight: 750; }
.h3 { font-size: 19px; font-weight: 700; }
.h4 { font-size: 15px; font-weight: 700; }
@container site (max-width: 760px) { .h1 { font-size: 31px; } .h2 { font-size: 24px; } .h3 { font-size: 17px; } }
.lede { font-size: 17px; color: var(--g5); max-width: 62ch; margin: 12px 0 0; }
.dark .lede { color: #e7eaed; }
p { margin: 0; }
.muted { color: var(--g5); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 24px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.between { justify-content: space-between; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 28px; }
.g2, .g3, .g4, .g5, .g6 { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0,1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.side { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; align-items: start; }
@container site (max-width: 1000px) { .g4, .g5, .g6 { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@container site (max-width: 760px) {
  .g2, .g3, .split, .side { grid-template-columns: minmax(0,1fr); gap: 16px; }
  .g4, .g5, .g6 { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
}

.ph { position: relative; background:
  linear-gradient(to top right, transparent calc(50% - .6px), var(--g3) calc(50% - .6px), var(--g3) calc(50% + .6px), transparent calc(50% + .6px)),
  linear-gradient(to bottom right, transparent calc(50% - .6px), var(--g3) calc(50% - .6px), var(--g3) calc(50% + .6px), transparent calc(50% + .6px)),
  var(--g1);
  border: 1px solid var(--g3); display: flex; align-items: center; justify-content: center; text-align: center; min-height: 120px; max-width: 100%; }
.ph > span { background: var(--paper); border: 1px solid var(--g3); font-family: var(--mono); font-size: 11.5px; color: var(--g5); padding: 4px 8px; max-width: 86%; }
.ar-16x9 { aspect-ratio: 16/9; min-height: 0; }
.ar-4x3 { aspect-ratio: 4/3; min-height: 0; }
.ar-1 { aspect-ratio: 1; min-height: 0; }
.ar-3x1 { aspect-ratio: 3/1; min-height: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 2px solid var(--ink); background: var(--paper);
  color: var(--ink); font-weight: 650; font-size: 14.5px; text-decoration: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.ghost { border-color: var(--g3); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
.btn.block { width: 100%; }
.dark .btn { background: transparent; color: #fff; border-color: #fff; }
.dark .btn.primary { background: #fff; color: var(--ink); }
.link { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--g3); border-radius: 999px; padding: 4px 12px; font-size: 13px; background: var(--paper); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tag { display: inline-block; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--g3); padding: 2px 7px; border-radius: 3px; color: var(--g5); background: var(--paper); }
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.solid { background: var(--ink); color: #fff; border-color: var(--ink); }
.card { border: 1px solid var(--g3); background: var(--paper); padding: 20px; position: relative; min-width: 0; }
.card.flat { border-color: var(--g2); }
.line { height: 10px; background: var(--g2); border-radius: 2px; }
.line.w60 { width: 60%; } .line.w80 { width: 80%; } .line.w40 { width: 40%; }
.lines { display: grid; gap: 8px; }
hr.rule { border: 0; border-top: 1px solid var(--g2); margin: 0; }
.ext::after { content: " ↗"; font-weight: 400; }
.pdf::before { content: "PDF"; font-family: var(--mono); font-size: 10.5px; font-weight: 600; border: 1px solid currentColor; padding: 1px 4px; margin-right: 8px; border-radius: 2px; }

/* Forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lbl { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12.5px; color: var(--g5); }
.input, .select, .textarea { width: 100%; min-height: 44px; border: 1.5px solid var(--g3); background: var(--paper); padding: 9px 12px; border-radius: 4px; }
.textarea { min-height: 110px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 2px; flex: none; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.form-grid .full { grid-column: 1 / -1; }
@container site (max-width: 760px) { .form-grid { grid-template-columns: minmax(0,1fr); } }
.searchbar { display: flex; border: 2px solid var(--ink); border-radius: 4px; background: var(--paper); overflow: hidden; min-width: 0; }
.searchbar input { flex: 1; min-width: 0; border: 0; padding: 0 14px; min-height: 48px; background: transparent; }
.searchbar select { border: 0; border-right: 1px solid var(--g3); padding: 0 10px; background: var(--g1); max-width: 40%; }
@container site (max-width: 760px) { .searchbar select { display: none; } }
.searchbar button { border: 0; background: var(--ink); color: #fff; padding: 0 18px; font-weight: 650; cursor: pointer; }
.success { border: 2px solid var(--ok); background: #eef7f1; padding: 20px; border-radius: 4px; }

/* ---------- Header ---------- */
.util { background: var(--g5); color: #fff; font-size: 13px; }
.util .wrap { display: flex; justify-content: space-between; gap: 16px; align-items: center; min-height: 38px; flex-wrap: wrap; }
.util a { text-decoration: none; }
.util .row { gap: 20px; }
.hdr { border-bottom: 1px solid var(--g3); background: var(--paper); position: relative; z-index: 20; }
.hdr .wrap { display: flex; align-items: center; gap: 28px; min-height: 84px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.logo .mark { width: 58px; height: 52px; border: 2px dashed var(--g4); display: grid; place-items: center; font: 700 15px var(--mono); color: var(--g5); background: var(--g1); }
.logo .wm { line-height: 1.1; }
.logo .wm b { display: block; font-size: 15px; letter-spacing: .02em; }
.logo .wm i { font-size: 12.5px; color: var(--g5); }
.nav { display: flex; gap: 2px; align-items: center; flex: 1; }
.nav > .item { position: relative; }
.nav > .item > a, .nav > .item > button { display: inline-flex; align-items: center; gap: 6px; padding: 10px 12px; font-weight: 650; font-size: 14.5px; text-decoration: none; background: none; border: 0; cursor: pointer; border-radius: 4px; }
.nav > .item > a:hover, .nav > .item > button:hover { background: var(--g1); }
.nav > .item > button::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-2px); }
.nav .menu { display: none; position: absolute; top: 100%; left: 0; min-width: 270px; background: var(--paper); border: 1px solid var(--g3); box-shadow: 0 14px 30px rgba(0,0,0,.12); padding: 10px; z-index: 30; }
.nav .item:hover .menu, .nav .item:focus-within .menu { display: grid; gap: 2px; }
.nav .menu a { padding: 10px 12px; text-decoration: none; border-radius: 3px; display: grid; }
.nav .menu a small { color: var(--g5); font-size: 12.5px; }
.nav .menu a:hover { background: var(--g1); }
.nav .menu a b { font-size: 14px; }
.hdr-actions { display: flex; gap: 10px; align-items: center; flex: none; }
.acct-pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--g3); border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 13px; }
.acct-pill .av { width: 26px; height: 26px; border-radius: 50%; background: var(--g2); display: grid; place-items: center; font-weight: 700; font-size: 11px; }
.hamb { display: none; width: 44px; height: 44px; border: 1.5px solid var(--g3); background: var(--paper); border-radius: 4px; cursor: pointer; align-items: center; justify-content: center; }
.hamb i { display: block; width: 20px; height: 2px; background: var(--ink); box-shadow: 0 -6px 0 var(--ink), 0 6px 0 var(--ink); }
.subsearch { border-bottom: 1px solid var(--g2); background: var(--g1); }
.subsearch .wrap { padding-block: 12px; display: flex; gap: 16px; align-items: center; }
.subsearch .searchbar { flex: 1; }
.subsearch .branch-sel { font-size: 13px; white-space: nowrap; }
.mnav { display: none; }
@container site (max-width: 1000px) {
  .nav, .hdr-actions .hide-m { display: none; }
  .hamb { display: inline-flex; }
  .hdr .wrap { justify-content: space-between; min-height: 68px; }
  .logo .mark { width: 46px; height: 42px; font-size: 13px; }
  .util .hide-m { display: none; }
  .subsearch .branch-sel { display: none; }
  .menu-open .mnav { display: block; border-bottom: 1px solid var(--g3); background: var(--paper); }
}
.mnav details { border-top: 1px solid var(--g2); }
.mnav summary, .mnav > .wrap > a { display: flex; justify-content: space-between; padding: 14px 0; font-weight: 650; cursor: pointer; text-decoration: none; list-style: none; }
.mnav summary::-webkit-details-marker { display: none; }
.mnav summary::after { content: "+"; font-weight: 400; }
.mnav details[open] summary::after { content: "–"; }
.mnav details a { display: block; padding: 10px 0 10px 14px; text-decoration: none; color: var(--g5); }
.mnav > .wrap > a { border-top: 1px solid var(--g2); }
.mnav .row { padding-block: 16px; }

/* Mobile action dock */
.dock { display: none; }
@container site (max-width: 760px) {
  .dock { display: grid; grid-template-columns: repeat(4, 1fr); position: sticky; bottom: 0; z-index: 25; background: var(--paper); border-top: 1px solid var(--g3); }
  .dock a { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 10px; text-decoration: none; font-size: 11.5px; font-weight: 600; }
  .dock a i { width: 22px; height: 22px; border: 2px solid var(--g5); border-radius: 5px; display: block; }
  .dock a.on i { background: var(--ink); border-color: var(--ink); }
}

/* ---------- Footer ---------- */
.ftr { background: var(--g5); color: #fff; }
.ftr .top { display: grid; grid-template-columns: 1.3fr repeat(4, minmax(0,1fr)); gap: 32px; padding-block: 48px 32px; }
.ftr h4 { font-size: 13px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; color: #e3e6ea; }
.ftr ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ftr a { text-decoration: none; }
.ftr a:hover { text-decoration: underline; }
.ftr .logo .mark { border-color: #c9ced4; color: #fff; background: transparent; }
.ftr .bottom { border-top: 1px solid rgba(255,255,255,.25); padding-block: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 12.5px; color: #e3e6ea; }
.ftr .btn { background: transparent; color: #fff; border-color: #fff; }
@container site (max-width: 1000px) { .ftr .top { grid-template-columns: repeat(2, minmax(0,1fr)); } .ftr .top > :first-child { grid-column: 1 / -1; } }

/* ---------- Page-specific ---------- */
.hero { padding-block: 56px; border-bottom: 1px solid var(--g2); position: relative; }
.hero .split { gap: 48px; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; border: 1px solid var(--g3); background: var(--paper); }
.quick a { padding: 20px; text-decoration: none; display: grid; gap: 6px; border-right: 1px solid var(--g3); min-width: 0; }
.quick a:last-child { border-right: 0; }
.quick a:hover { background: var(--g1); }
.quick .ico { width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 6px; }
@container site (max-width: 760px) {
  .quick { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .quick a:nth-child(2) { border-right: 0; }
  .quick a:nth-child(-n+2) { border-bottom: 1px solid var(--g3); }
}
.stat b { display: block; font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13.5px; color: var(--g5); }
.dark .stat span { color: #e3e6ea; }
@container site (max-width: 760px) { .stat b { font-size: 30px; } }
.brandtile { border: 1px solid var(--g3); min-height: 88px; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; color: var(--g5); background: var(--paper); text-decoration: none; padding: 8px; text-align: center; }
.cat { border: 1px solid var(--g3); padding: 16px; text-decoration: none; display: grid; gap: 10px; background: var(--paper); min-width: 0; }
.cat:hover { border-color: var(--ink); }
.cat .ph { min-height: 0; aspect-ratio: 4/3; }

.crumbs { font-size: 13px; color: var(--g5); padding-block: 16px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs a { text-decoration: none; }
.pagehead { padding-block: 24px 40px; border-bottom: 1px solid var(--g2); position: relative; }

.filters { display: grid; gap: 22px; }
.filters fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.filters legend { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; padding: 0; }
@container site (max-width: 760px) { .filters { display: none; } .filters.open { display: grid; } }
.mfilter { display: none; }
@container site (max-width: 760px) { .mfilter { display: inline-flex; } }

.plist { display: grid; gap: 0; border-top: 1px solid var(--g3); }
.prow { display: grid; grid-template-columns: 120px minmax(0, 1fr) 220px; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--g3); align-items: center; }
.prow .ph { min-height: 0; aspect-ratio: 1; }
.price { display: grid; gap: 6px; justify-items: start; }
.price b { font-size: 21px; font-variant-numeric: tabular-nums; }
.gate { border: 1.5px dashed var(--g4); padding: 10px 12px; font-size: 13px; display: grid; gap: 6px; width: 100%; background: var(--g1); }
@container site (max-width: 760px) { .prow { grid-template-columns: 84px minmax(0, 1fr); } .prow .price { grid-column: 1 / -1; } }

.loc { display: grid; grid-template-columns: 400px minmax(0, 1fr); border: 1px solid var(--g3); height: 640px; }
.loc .list { overflow-y: auto; border-right: 1px solid var(--g3); }
.loc .map { position: relative; background: var(--g1); min-height: 0; }
.loc .map svg { width: 100%; height: 100%; display: block; }
.bcard { padding: 16px 18px; border-bottom: 1px solid var(--g2); display: grid; gap: 4px; cursor: pointer; }
.bcard:hover, .bcard.on { background: var(--g1); }
.bcard .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
@container site (max-width: 900px) { .loc { grid-template-columns: minmax(0,1fr); height: auto; } .loc .map { height: 260px; order: -1; border-bottom: 1px solid var(--g3); } .loc .list { border-right: 0; max-height: 520px; } }
.mapsvg .dot { fill: var(--g5); stroke: #fff; stroke-width: 2; cursor: pointer; }
.mapsvg .dot.on { fill: var(--note); r: 9; }
.mapsvg text { font-family: var(--mono); font-size: 11px; fill: var(--g5); }

.hours { display: grid; grid-template-columns: auto 1fr; gap: 4px 20px; font-size: 14px; font-variant-numeric: tabular-nums; }
.kv { display: grid; gap: 2px; margin: 0; }
.kv dt { font-size: 12px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--g5); }
.kv dd { margin: 0; font-weight: 600; }

.steps { display: flex; gap: 0; border: 1px solid var(--g3); counter-reset: s; overflow-x: auto; }
.steps li { list-style: none; flex: 1; padding: 12px 14px; border-right: 1px solid var(--g3); font-size: 13px; color: var(--g5); min-width: 120px; display: grid; gap: 2px; }
.steps li:last-child { border-right: 0; }
.steps li b { font-family: var(--mono); font-size: 11px; }
.steps li.on { background: var(--ink); color: #fff; }
.steps li.done { background: var(--g1); color: var(--ink); }
.opt { border: 1.5px solid var(--g3); padding: 16px; display: grid; gap: 6px; cursor: pointer; text-align: left; background: var(--paper); border-radius: 4px; min-width: 0; }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--g1); }
.opt b { font-size: 15px; }
.opt span { font-size: 13px; color: var(--g5); }
.sig { border: 1.5px dashed var(--g4); height: 150px; width: 100%; background: var(--g1); touch-action: none; display: block; cursor: crosshair; }

.doc { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--g2); }
.article { max-width: 70ch; display: grid; gap: 16px; }
.faq details { border-bottom: 1px solid var(--g3); padding: 14px 0; }
.faq summary { font-weight: 650; cursor: pointer; }
.faq details p { margin-top: 8px; color: var(--g5); }

.smap { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
.smap .col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.smap .col > b { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--g5); }
.node { display: block; text-decoration: none; padding: 9px 12px; font-size: 13.5px; font-weight: 600; background: var(--ink); color: #fff; border: 2px solid var(--ink); border-radius: 3px; }
.node.form { background: var(--paper); color: var(--ink); }
.node.ext { background: var(--g2); color: var(--ink); border-color: var(--g2); }
.node.ext::after { content: " ↗"; }
.node.child { margin-left: 16px; }
@container site (max-width: 1000px) { .smap { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@container site (max-width: 560px) { .smap { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.banner { border: 1.5px dashed var(--g4); padding: 14px 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--g1); }
</style>

function mapSVG(sel, list) {
  const W=640, H=320;
  const x = lon => 30 + (lon + 113.5) / 28 * (W - 60);
  const y = lat => 24 + (36.6 - lat) / 7 * (H - 60);
  const ids = new Set(list.map(b=>b.i));
  const grid = Array.from({length:9},(_,i)=>`<line x1="${i*80}" y1="0" x2="${i*80}" y2="${H}" stroke="#dde1e5"/>`).join("") + Array.from({length:5},(_,i)=>`<line x1="0" y1="${i*80}" x2="${W}" y2="${i*80}" stroke="#dde1e5"/>`).join("");
  const dots = BRANCHES.filter(b=>ids.has(b.i)).map(b=>`<circle class="dot ${b.i===sel?'on':''}" cx="${x(b.lon).toFixed(1)}" cy="${y(b.lat).toFixed(1)}" r="6" data-pick="${b.i}"><title>${bname(b)}</title></circle>`).join("");
  const labels = Object.keys(STATES).map(st => { const bs = BRANCHES.filter(b=>b.st===st); const ax = bs.reduce((s,b)=>s+x(b.lon),0)/bs.length; const ay = Math.max(...bs.map(b=>y(b.lat))) + 22; return `<text x="${ax.toFixed(0)}" y="${Math.min(ay,H-8).toFixed(0)}" text-anchor="middle">${st}</text>`; }).join("");
  return `<svg class="mapsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Branch map (placeholder for interactive map embed)">${grid}${labels}${dots}<text x="${W-12}" y="${H-10}" text-anchor="end">Interactive map embed · placeholder</text></svg>`;
}

    <div class="field"><span class="lbl">Valid driver's license?</span><div class="row"><label class="check"><input type="radio" name="dl"> Yes</label><label class="check"><input type="radio" name="dl"> No</label></div></div>
    <div class="field"><span class="lbl">Authorized to work in the US?</span><div class="row"><label class="check"><input type="radio" name="wa"> Yes</label><label class="check"><input type="radio" name="wa"> No</label></div></div>
    <label class="check full"><input type="checkbox"> I certify the information above is accurate. (EEO statement placeholder)</label>
    <div class="full"><button class="btn primary" type="submit">Submit Application</button></div></form>`}</div></section>`;
N.apply = [["Embedded application","Brief: online job application on-site. Routes to the selected branch's hiring manager inbox, not to named staff."],["Resume upload","Optional upload plus a free-text field for mobile applicants without a resume file."]];

P.contact = () => `${crumbs("Contact Us")}${pagehead("Support","Contact Us","Tell us what you need and we'll route it to the right branch team. For fastest help, call your local branch.","",1)}
  <section class="sec"><div class="wrap split" style="align-items:start">
    ${formOk("contact","Message sent.","Your message went to the "+bname(BRANCHES[S.my])+" team. Expect a reply within 1 business day.") || `<form class="form-grid" data-form="contact">${pin(2)}
      <div class="field full"><label for="ct-topic">How can we help?</label><select class="select" id="ct-topic"><option>Product or stock question</option><option>Equipment quote</option><option>Account or billing</option><option>Warranty or return</option><option>Vendor / partnership inquiry</option><option>Website feedback</option></select></div>
      <div class="field full"><label for="ct-br">Branch</label><select class="select" id="ct-br">${BRANCHES.map(b=>`<option ${b.i===S.my?'selected':''}>${bname(b)}</option>`).join("")}</select></div>
      <div class="field"><label for="ct-n">Name</label><input class="input" id="ct-n"></div><div class="field"><label for="ct-co">Company</label><input class="input" id="ct-co"></div>
      <div class="field"><label for="ct-e">Email</label><input class="input" id="ct-e" type="email"></div><div class="field"><label for="ct-p">Phone</label><input class="input" id="ct-p" type="tel"></div>
      <div class="field full"><label for="ct-m">Message</label><textarea class="textarea" id="ct-m"></textarea></div>
      <div class="full"><button class="btn primary" type="submit">Send Message</button></div></form>`}
    <div class="stack">
      <div class="card stack"><b class="h3">Your branch</b><p><b>${bname(BRANCHES[S.my])}</b><br><span class="muted small">[Street address] · (XXX) XXX-XXXX</span></p><a class="link small" href="#branch" data-branch="${S.my}">Branch details</a></div>
      <div class="card stack">${pin(3)}<b class="h3">Corporate office</b><p class="muted small">[HQ address], Jackson, MS<br>(XXX) XXX-XXXX</p></div>
      <div class="card stack"><b class="h3">Billing questions?</b><a class="btn sm ext" href="#login" data-act="portal">Payment Portal</a></div>
    </div></div></section>`;
N.contact = [["Footer page","Contact Us appears under Support in the footer."],["Generic routing","Topic + branch selection routes to department inboxes. No individual staff names or emails (brief requirement)."],["HQ","Corporate info only. Branch phone numbers live on branch pages."]];

/* ---------------- Render ---------------- */
const site = $("#site"), rail = $("#rail");
function render() {
  const r = P[S.route] ? S.route : "home";
  site.classList.toggle("menu-open", S.menu);
  site.innerHTML = header() + `<main id="main">${P[r]()}</main>` + footer() + dock();
  const notes = N[r] || [];
  rail.innerHTML = `<h2>Annotations</h2><p class="pg">${LABEL[r]}</p><p class="tpl">#${r} · ${S.loggedIn?"logged-in":"guest"} state</p>
    <ol>${notes.map((n,i)=>`<li><span class="pin">${i+1}</span><div><b>${n[0]}</b><span>${n[1]}</span></div></li>`).join("")}</ol>
    <div class="legend">Wireframe only · grayscale on purpose. Placeholder brackets [ ] = client to supply. Branch cities are sample data.</div>`;
  $("#devRoute").textContent = "#" + r;
  $("#pagePick").value = r;
  if (r === "credit-app" && S.ca === 3 && !S.sent.credit) initSig();
}
function go(route, keepScroll) {
  S.route = route; S.menu = false; S.filterOpen = false;
  render();
  if (!keepScroll) { const top = $("#device").getBoundingClientRect().top + window.scrollY - 70; window.scrollTo({ top: Math.max(0, top), behavior: "instant" in window ? "instant" : "auto" }); }
}
function setLogged(v) { S.loggedIn = v; $("#sIn").setAttribute("aria-pressed", v); $("#sOut").setAttribute("aria-pressed", !v); render(); }

/* signature pad */
function initSig() {
  const c = $("#sig"); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const ctx = c.getContext("2d"); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = "#16191d";
  let down = false;
  const p = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.addEventListener("pointerdown", e => { down = true; c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...p(e)); });
  c.addEventListener("pointermove", e => { if (!down) return; ctx.lineTo(...p(e)); ctx.stroke(); });
  c.addEventListener("pointerup", () => down = false);
  c.addEventListener("pointercancel", () => down = false);
}

/* ---------------- Events ---------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-branch],[data-pick],[data-state],[data-sb]");
  if (!t || !site.contains(t) && !t.closest(".site")) return;
  if (t.dataset.branch != null) { S.view = +t.dataset.branch; if (location.hash === t.getAttribute('href')) { e.preventDefault(); go(S.route); return; } }
  if (t.dataset.pick != null && !t.dataset.act) { S.view = +t.dataset.pick; render(); return; }
  if (t.dataset.state != null) { e.preventDefault(); S.stateFilter = t.dataset.state; S.locQuery = ""; if (S.route !== "locations") { location.hash = "locations"; return; } render(); return; }
  if (t.dataset.sb != null) { S.sb.a[S.sb.step] = +t.dataset.sb; render(); return; }
  const a = t.dataset.act;
  if (!a) return;
  if (a === "menu") { S.menu = !S.menu; render(); }
  else if (a === "logout") { e.preventDefault(); setLogged(false); if (location.hash !== "#home") location.hash = "home"; }
  else if (a === "portal") { e.preventDefault(); showToast("External link → proprietary Payment Portal (opens in new tab)"); }
  else if (a === "cart") { showToast("Added to order (prototype)"); }
  else if (a === "geo") { e.preventDefault(); S.stateFilter = "All"; S.locQuery = ""; S.view = 0; showToast("Simulated location: nearest branch is Jackson, MS"); if (S.route !== "locations") location.hash = "locations"; else render(); }
  else if (a === "mybranch") { e.preventDefault(); S.my = +t.dataset.b; store.set("jsc-my", String(S.my)); showToast("My branch set to " + bname(BRANCHES[S.my])); render(); }
  else if (a === "filters") { S.filterOpen = !S.filterOpen; render(); }
  else if (a === "sb-next") { S.sb.step++; render(); }
  else if (a === "sb-back") { S.sb.step = Math.max(0, S.sb.step - 1); render(); }
  else if (a === "sb-reset") { S.sb = { step: 0, a: {} }; render(); }
  else if (a === "ca-back") { S.ca = Math.max(0, S.ca - 1); render(); }
  else if (a === "sig-clear") { const c = $("#sig"); c.getContext("2d").clearRect(0,0,c.width,c.height); }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form;
  if (k === "search") { showToast("Search results page (out of scope for this round)"); location.hash = "supplies"; }
  else if (k === "finder") { S.locQuery = f.querySelector("input").value; S.stateFilter = "All"; location.hash = "locations"; }
  else if (k === "loc") { S.locQuery = $("#locq").value; S.stateFilter = "All"; render(); }
  else if (k === "login") { setLogged(true); location.hash = "supplies"; showToast("Logged in as ABC Mechanical (demo)"); }
  else if (k === "credit") { if (S.ca < CA.length - 1) { S.ca++; render(); } else { S.sent.credit = true; render(); } }
  else { S.sent[k] = true; render(); }
});

/* toast */
let toastT;
function showToast(msg) {
  let el = $("#toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.setAttribute("role","status");
    el.style.cssText = "position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16191d;color:#fff;font:500 13px var(--mono);padding:10px 16px;border-radius:6px;z-index:80;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)";
    document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600);
}

/* prototype chrome */
const pick = $("#pagePick");
pick.innerHTML = PAGES.map(([g, list]) => `<optgroup label="${g}">${list.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</optgroup>`).join("");
pick.addEventListener("change", () => { location.hash = pick.value; });
function setDevice(m) {
  $("#device").classList.toggle("mobile", m);
  $("#vMob").setAttribute("aria-pressed", m); $("#vDesk").setAttribute("aria-pressed", !m);
  $("#devName").textContent = m ? "Mobile · 390" : "Desktop · 1280";
  store.set("jsc-dev", m ? "m" : "d");
}
$("#vDesk").onclick = () => setDevice(false);
$("#vMob").onclick = () => setDevice(true);
$("#sIn").onclick = () => setLogged(true);
$("#sOut").onclick = () => setLogged(false);
$("#notesTog").addEventListener("change", e => {
  $("#proto").classList.toggle("no-notes", !e.target.checked);
  $("#proto").classList.toggle("no-pins", !e.target.checked);
});

const my = store.get("jsc-my"); if (my != null && BRANCHES[+my]) S.my = S.view = +my;
if (store.get("jsc-dev") === "m") setDevice(true);
const fromHash = () => { const h = location.hash.replace("#",""); go(P[h] ? h : "home", !h); };
window.addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
