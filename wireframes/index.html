<title>Jackson Supply Wireframes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: prototype chrome (toolbar + annotation rail) around a resizable "site" frame; the site uses container queries so the Mobile toggle shows true small-screen layouts. Single light theme on purpose: wireframes read as paper. */
:root {
  --paper: #ffffff;
  --desk: #e9ebee;
  --ink: #16191d;
  --g1: #f3f4f6;
  --g2: #e2e5e9;
  --g3: #c4c9cf;
  --g4: #8a929b;
  --g5: #545b63;
  --note: #2f62d6;
  --ok: #2d7a4a;
  --warn: #8a5a00;
  --bad: #b3261e;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--desk); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.5; margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--note); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Prototype chrome ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
.proto-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--ink); color: #fff; font-family: var(--mono); font-size: 12.5px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.proto-bar .name { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.proto-bar .name small { color: #9aa3ad; font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 6px; }
.proto-bar label { display: inline-flex; align-items: center; gap: 8px; color: #c8cdd3; }
.proto-bar select { background: #2a2f36; color: #fff; border: 1px solid #3c434c; border-radius: 4px; padding: 5px 8px; max-width: 62vw; }
.seg { display: inline-flex; border: 1px solid #3c434c; border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: #c8cdd3; padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
.proto-bar .spacer { flex: 1; }

.proto { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; align-items: start;
  padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proto.no-notes { grid-template-columns: minmax(0, 1fr); }
.proto.no-notes .rail { display: none; }
@media (max-width: 1080px) { .proto { grid-template-columns: minmax(0, 1fr); } }
.stage { min-width: 0; display: flex; justify-content: center; }
.device { width: 100%; max-width: 1280px; transition: max-width .25s ease; }
.device.mobile { max-width: 390px; }
.device-label { font-family: var(--mono); font-size: 11.5px; color: var(--g5); display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.site { container-type: inline-size; container-name: site; background: var(--paper); border: 1px solid var(--g3); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(20,30,40,.08); position: relative; overflow: hidden; }
.device.mobile .site { border-radius: 28px; border-width: 8px; border-color: var(--ink); }

.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); font-size: 13.5px; min-width: 0; max-height: calc(100vh - 90px); overflow-y: auto; padding-bottom: 12px; }
@media (max-width: 1080px) { .rail { position: static; max-height: none; } }
.rail h2 { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--g5); margin: 0 0 4px; font-weight: 600; }
.rail h3 { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--g5); margin: 18px 0 8px; font-weight: 600; }
.rail .pg { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
.rail .tpl { font-family: var(--mono); font-size: 11.5px; color: var(--g5); margin: 0 0 14px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rail li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; background: var(--paper); border: 1px solid var(--g2); border-radius: 6px; padding: 10px 12px; }
.rail li b { display: block; font-size: 13px; }
.rail li > div > span { color: var(--g5); display: block; }
.rail li > div > span.refs { font-family: var(--mono); font-size: 11px; color: var(--note); margin-top: 4px; }
.rail .ev { display: flex; flex-wrap: wrap; gap: 6px; }
.rail .ev code { font-family: var(--mono); font-size: 11.5px; background: var(--paper); border: 1px solid var(--g2); border-radius: 3px; padding: 2px 6px; }
.rail .legend { margin-top: 16px; font-family: var(--mono); font-size: 11.5px; color: var(--g5); line-height: 1.6; }

.pin { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--note); color: #fff;
  font: 600 11.5px/1 var(--mono); flex: none; vertical-align: middle; box-shadow: 0 0 0 3px rgba(47,98,214,.18); }
.pin-abs { position: absolute; top: 10px; right: 10px; z-index: 3; }
.no-pins .site .pin { display: none; }
.demo-link { font-family: var(--mono); font-size: 12px; color: var(--note); background: none; border: 1px dashed var(--note); padding: 4px 8px; border-radius: 3px; cursor: pointer; }
.no-pins .site .demo-link { display: none; }

/* ---------- Wireframe primitives ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }
@container site (max-width: 760px) { .wrap { padding-left: 16px; padding-right: 16px; } }
.sec { padding-block: 56px; position: relative; }
.sec.tight { padding-block: 32px; }
.sec.tint { background: var(--g1); }
.sec.dark { background: var(--g5); color: #fff; }
@container site (max-width: 760px) { .sec { padding-block: 36px; } }
.eyebrow { display: block; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--g5); margin: 0 0 8px; font-weight: 500; }
.dark .eyebrow { color: #dfe3e7; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -.01em; }
.h1 { font-size: 46px; font-weight: 800; }
.h2 { font-size: 30px; font-weight: 750; line-height: 1.15; }
.h3 { font-size: 19px; font-weight: 700; }
.h4 { font-size: 15.5px; font-weight: 700; }
@container site (max-width: 760px) { .h1 { font-size: 31px; } .h2 { font-size: 24px; } .h3 { font-size: 17px; } }
.lede { font-size: 17px; color: var(--g5); max-width: 62ch; margin: 12px 0 0; }
.dark .lede { color: #e7eaed; }
p { margin: 0; }
.muted { color: var(--g5); }
.small { font-size: 14px; }
.mono { font-family: var(--mono); }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 24px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.between { justify-content: space-between; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 28px; }
.g2, .g3, .g4, .g6 { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0,1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.side { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; align-items: start; }
@container site (max-width: 1000px) { .g4, .g6 { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@container site (max-width: 760px) {
  .g2, .g3, .split, .side { grid-template-columns: minmax(0,1fr); gap: 16px; }
  .g4, .g6 { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
}
.ph { position: relative; background:
  linear-gradient(to top right, transparent calc(50% - .6px), var(--g3) calc(50% - .6px), var(--g3) calc(50% + .6px), transparent calc(50% + .6px)),
  linear-gradient(to bottom right, transparent calc(50% - .6px), var(--g3) calc(50% - .6px), var(--g3) calc(50% + .6px), transparent calc(50% + .6px)),
  var(--g1);
  border: 1px solid var(--g3); display: flex; align-items: center; justify-content: center; text-align: center; min-height: 120px; max-width: 100%; }
.ph > span { background: var(--paper); border: 1px solid var(--g3); font-family: var(--mono); font-size: 11.5px; color: var(--g5); padding: 4px 8px; max-width: 86%; }
.ar-16x9 { aspect-ratio: 16/9; min-height: 0; }
.ar-4x3 { aspect-ratio: 4/3; min-height: 0; }
.ar-1 { aspect-ratio: 1; min-height: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 2px solid var(--ink); background: var(--paper);
  color: var(--ink); font-weight: 650; font-size: 15px; text-decoration: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.ghost { border-color: var(--g3); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.dark .btn { background: transparent; color: #fff; border-color: #fff; }
.dark .btn.primary { background: #fff; color: var(--ink); }
.link { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--g3); border-radius: 999px; min-height: 44px; padding: 0 16px; font-size: 14px; background: var(--paper); cursor: pointer; white-space: nowrap; text-decoration: none; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip .x { font-size: 16px; line-height: 1; }
.tag { display: inline-block; font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; border: 1px solid var(--g3); padding: 2px 7px; border-radius: 3px; color: var(--g5); background: var(--paper); }
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.warn { color: var(--warn); border-color: var(--warn); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.tag.solid { background: var(--ink); color: #fff; border-color: var(--ink); }
.card { border: 1px solid var(--g3); background: var(--paper); padding: 20px; position: relative; min-width: 0; }
.card.flat { border-color: var(--g2); }
a.card { text-decoration: none; }
a.card:hover { border-color: var(--ink); }
.line { height: 10px; background: var(--g2); border-radius: 2px; }
.line.w60 { width: 60%; }
.lines { display: grid; gap: 8px; }
.ext::after { content: " ↗"; font-weight: 400; }
.pdf::before { content: "PDF"; font-family: var(--mono); font-size: 10.5px; font-weight: 600; border: 1px solid currentColor; padding: 1px 4px; margin-right: 8px; border-radius: 2px; }
.ico { width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 6px; display: block; }
.amt { font-variant-numeric: tabular-nums; }
.price b.amt { font-size: 21px; }

/* Forms */
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field label, .lbl { font-size: 14px; font-weight: 600; padding: 0; }
.field .hint { font-size: 13px; color: var(--g5); }
.req { color: var(--bad); }
.err { font-size: 13.5px; color: var(--bad); font-weight: 600; }
.err::before { content: "! "; }
.has-err .input, .has-err .select, .has-err .textarea { border-color: var(--bad); border-width: 2px; }
.errsum { border: 2px solid var(--bad); padding: 16px 18px; border-radius: 4px; display: grid; gap: 8px; }
.errsum ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.errsum button { color: var(--bad); text-align: left; }
.input, .select, .textarea { width: 100%; min-height: 44px; border: 1.5px solid var(--g3); background: var(--paper); padding: 9px 12px; border-radius: 4px; }
.textarea { min-height: 110px; resize: vertical; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; min-height: 32px; font-weight: 400; }
.check input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
.form-grid .full { grid-column: 1 / -1; }
@container site (max-width: 760px) { .form-grid { grid-template-columns: minmax(0,1fr); } }
.searchbar { display: flex; border: 2px solid var(--ink); border-radius: 4px; background: var(--paper); overflow: hidden; min-width: 0; }
.searchbar input { flex: 1; min-width: 0; border: 0; padding: 0 14px; min-height: 48px; background: transparent; }
.searchbar button { border: 0; background: var(--ink); color: #fff; padding: 0 18px; font-weight: 650; cursor: pointer; }
.success { border: 2px solid var(--ok); padding: 20px; border-radius: 4px; }
.choice { border: 2px solid var(--g3); border-radius: 6px; padding: 20px; display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 12px; cursor: pointer; background: var(--paper); }
.choice:has(input:checked) { border-color: var(--ink); background: var(--g1); }
.choice input { width: 20px; height: 20px; margin: 3px 0 0; }
.seg-btns { display: inline-flex; border: 1.5px solid var(--g3); border-radius: 4px; overflow: hidden; }
.seg-btns button { border: 0; background: var(--paper); padding: 0 16px; min-height: 40px; cursor: pointer; font-weight: 600; }
.seg-btns button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.typed-sig { font-family: "Brush Script MT", "Segoe Script", cursive; font-size: 34px; border-bottom: 2px solid var(--ink); min-height: 60px; padding: 4px 8px; }
.sig { border: 1.5px dashed var(--g4); height: 150px; width: 100%; background: var(--g1); touch-action: none; display: block; cursor: crosshair; }

/* ---------- Header ---------- */
.skip { position: absolute; left: 12px; top: -60px; z-index: 40; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 4px; font-weight: 600; text-decoration: none; }
.skip:focus { top: 12px; }
.util { background: var(--g5); color: #fff; font-size: 14px; }
.util .wrap { display: flex; justify-content: space-between; gap: 16px; align-items: center; min-height: 40px; flex-wrap: wrap; }
.util a { text-decoration: none; }
.util a:hover { text-decoration: underline; }
.util .row { gap: 22px; }
.hdr { border-bottom: 1px solid var(--g3); background: var(--paper); position: relative; z-index: 20; }
.hdr .wrap { display: flex; align-items: center; gap: 24px; min-height: 80px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.logo .mark { width: 58px; height: 52px; border: 2px dashed var(--g4); display: grid; place-items: center; font: 700 15px var(--mono); color: var(--g5); background: var(--g1); }
.logo .wm { line-height: 1.1; }
.logo .wm b { display: block; font-size: 15px; letter-spacing: .02em; }
.logo .wm i { font-size: 12.5px; color: var(--g5); }
.nav { flex: 1; }
.nav > ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; }
.nav .item { position: relative; }
.nav .item > a, .nav .item > button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; font-weight: 650; font-size: 15px; text-decoration: none; background: none; border: 0; cursor: pointer; border-radius: 4px; }
.nav .item > a:hover, .nav .item > button:hover, .nav .item.open > button { background: var(--g1); }
.nav .item > button::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-2px); }
.nav .item.open > button::after { transform: rotate(-135deg) translateY(-2px); }
.nav .item > a[aria-current="page"], .nav .item.cur > button { box-shadow: inset 0 -3px 0 var(--ink); }
.nav .menu { display: none; position: absolute; top: calc(100% + 6px); left: 0; min-width: 280px; background: var(--paper); border: 1px solid var(--g3); box-shadow: 0 14px 30px rgba(0,0,0,.12); padding: 12px; z-index: 30; }
.nav .item.open .menu { display: grid; gap: 2px; }
.nav .menu.mega { grid-template-columns: repeat(3, minmax(190px, 1fr)); gap: 8px 16px; min-width: 680px; }
.nav .menu .col { display: grid; gap: 2px; align-content: start; }
.nav .menu .col > b { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--g5); padding: 6px 12px; }
.nav .menu a { padding: 9px 12px; text-decoration: none; border-radius: 3px; display: grid; }
.nav .menu a small { color: var(--g5); font-size: 13px; }
.nav .menu a:hover { background: var(--g1); }
.nav .menu a b { font-size: 14.5px; }
.hdr-actions { display: flex; gap: 10px; align-items: center; flex: none; }
.acct-pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--g3); border-radius: 999px; padding: 6px 14px 6px 6px; font-size: 14px; text-decoration: none; min-height: 44px; }
.acct-pill .av { width: 30px; height: 30px; border-radius: 50%; background: var(--g2); display: grid; place-items: center; font-weight: 700; font-size: 11px; }
.hamb { display: none; width: 44px; height: 44px; border: 1.5px solid var(--g3); background: var(--paper); border-radius: 4px; cursor: pointer; align-items: center; justify-content: center; }
.hamb i { display: block; width: 20px; height: 2px; background: var(--ink); box-shadow: 0 -6px 0 var(--ink), 0 6px 0 var(--ink); }
.subsearch { border-bottom: 1px solid var(--g2); background: var(--g1); }
.subsearch .wrap { padding-block: 12px; display: flex; gap: 16px; align-items: center; }
.subsearch .searchbar { flex: 1; }
.subsearch .branch-sel { font-size: 14px; white-space: nowrap; }
.mnav { display: none; }
@container site (max-width: 1000px) {
  .nav, .hdr-actions .hide-m, .util, .subsearch .branch-sel { display: none; }
  .hamb { display: inline-flex; }
  .hdr .wrap { justify-content: space-between; min-height: 64px; }
  .logo .mark { width: 44px; height: 40px; font-size: 13px; }
  .logo .wm i { display: none; }
  .subsearch .wrap { padding-block: 8px; }
  .subsearch .searchbar input { min-height: 44px; }
  .menu-open .mnav { display: block; border-bottom: 1px solid var(--g3); background: var(--paper); }
}
.mnav details { border-top: 1px solid var(--g2); }
.mnav summary, .mnav .wrap > a { display: flex; justify-content: space-between; align-items: center; min-height: 52px; font-weight: 650; cursor: pointer; text-decoration: none; list-style: none; }
.mnav summary::-webkit-details-marker { display: none; }
.mnav summary::after { content: "+"; font-weight: 400; font-size: 20px; }
.mnav details[open] summary::after { content: "–"; }
.mnav details a { display: flex; align-items: center; min-height: 44px; padding-left: 14px; text-decoration: none; color: var(--g5); }
.mnav .wrap > a { border-top: 1px solid var(--g2); }
.mnav .mybr { background: var(--g1); padding: 14px 16px; margin: 12px 0; display: grid; gap: 8px; }
.mnav .row { padding-block: 16px; }

.dock { display: none; }
@container site (max-width: 760px) {
  .dock { display: grid; grid-template-columns: repeat(4, 1fr); position: sticky; bottom: 0; z-index: 25; background: var(--paper); border-top: 1px solid var(--g3); }
  .dock a { display: grid; justify-items: center; gap: 3px; padding: 8px 2px 10px; text-decoration: none; font-size: 12px; font-weight: 600; min-height: 56px; }
  .dock a i { width: 22px; height: 22px; border: 2px solid var(--g5); border-radius: 5px; display: block; }
  .dock a[aria-current="page"] i { background: var(--ink); border-color: var(--ink); }
}

/* ---------- Footer ---------- */
.ftr { background: var(--g5); color: #fff; }
.ftr .top { display: grid; grid-template-columns: 1.3fr repeat(5, minmax(0,1fr)); gap: 28px; padding-block: 48px 32px; }
.ftr h2 { font-size: 12.5px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; color: #e3e6ea; font-weight: 600; }
.ftr ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.ftr li a { display: inline-flex; align-items: center; min-height: 32px; text-decoration: none; font-size: 14px; }
.ftr a:hover { text-decoration: underline; }
.ftr .logo .mark { border-color: #c9ced4; color: #fff; background: transparent; }
.ftr .bottom { border-top: 1px solid rgba(255,255,255,.25); padding-block: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: #e3e6ea; }
.ftr .btn { background: transparent; color: #fff; border-color: #fff; }
@container site (max-width: 1100px) { .ftr .top { grid-template-columns: repeat(3, minmax(0,1fr)); } .ftr .top > :first-child { grid-column: 1 / -1; } }

  if (S.errFor !== key) return "";
  const ids = Object.keys(S.err); if (!ids.length) return "";
  return `<div class="errsum full" role="alert" tabindex="-1" id="errsum"><b>Fix ${ids.length} ${ids.length===1?"thing":"things"} to continue</b><ul>${ids.map(id=>`<li><button type="button" class="link" data-focus="${id}">${S.err[id]}</button></li>`).join("")}</ul></div>`;
}
function validate(form, key) {
  S.err = {}; S.errFor = key;
  const seen = new Set();
  form.querySelectorAll("[required]").forEach(el => {
    const name = el.type === "radio" ? el.name : el.id;
    if (seen.has(name)) return; seen.add(name);
    const labelEl = el.type === "radio" ? el.closest("fieldset")?.querySelector("legend") : form.querySelector(`label[for="${el.id}"]`);
    const label = labelEl ? labelEl.textContent.replace("*","").trim() : "this field";
    const lc = label.charAt(0).toLowerCase() + label.slice(1);
    if (el.type === "checkbox") { if (!el.checked) S.err[name] = "Check this box to continue"; }
    else if (el.type === "radio") { if (!form.querySelector(`[name="${name}"]:checked`)) S.err[name] = `Answer "${label}"`; }
    else if (el.type === "file") { if (!el.files.length) S.err[name] = "Upload your " + lc; }
    else if (!el.value.trim()) S.err[name] = el.dataset.err || (el.tagName === "SELECT" ? "Choose a " : "Enter ") + lc;
    else if (el.type === "email" && !/^\S+@\S+\.\S+$/.test(el.value)) S.err[name] = "Enter an email like name@company.com";
  });
  return Object.keys(S.err).length === 0;
}
const clearErr = () => { S.err = {}; S.errFor = null; };

/* ================= Map (Arizona shown as an inset) ================= */
function mapSVG(sel, list, o={}) {
  const W = 640, H = 320;
  const px = b => b.st === "AZ" ? [22 + (b.lon + 113.5) / 3.5 * 100, 30 + (34.3 - b.lat) / 2.5 * 70] : [150 + (b.lon + 98.5) / 13.5 * (W - 170), 20 + (36.8 - b.lat) / 7.5 * (H - 40)];
  const ids = new Set(list.map(b => b.i));
  const grid = Array.from({length:9},(_,i)=>`<line x1="${i*80}" y1="0" x2="${i*80}" y2="${H}" stroke="#dde1e5"/>`).join("") + Array.from({length:5},(_,i)=>`<line x1="0" y1="${i*80}" x2="${W}" y2="${i*80}" stroke="#dde1e5"/>`).join("");
  const inset = `<rect x="10" y="10" width="124" height="104" fill="#ffffff" stroke="#c4c9cf" stroke-dasharray="4 3"/><text x="16" y="24">AZ (inset)</text>`;
  const labels = Object.keys(STATES).filter(s=>s!=="AZ").map(st => { const bs = BRANCHES.filter(b=>b.st===st).map(px); const ax = bs.reduce((s,p)=>s+p[0],0)/bs.length; const ay = Math.max(...bs.map(p=>p[1])) + 22; return `<text x="${ax.toFixed(0)}" y="${Math.min(ay,H-24).toFixed(0)}" text-anchor="middle">${st}</text>`; }).join("");
  const dots = BRANCHES.filter(b => ids.has(b.i)).map(b => { const [x,y] = px(b); return `<circle class="dot ${b.i===sel?'on':''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${b.i===sel?8:6}" data-pick="${b.i}"><title>${bname(b)}</title></circle>`; }).join("");
  let origin = "";
  if (o.origin) { const [x,y] = px(o.origin); origin = `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12" fill="none" stroke="#2f62d6" stroke-width="2" stroke-dasharray="3 2"/>`; }
  return `<svg class="mapsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">${grid}${inset}${labels}${origin}${dots}<text x="${W-12}" y="${H-10}" text-anchor="end">Interactive map embed · placeholder</text></svg>`;
}

function resolveLoc() {
  const L = S.loc, q = (L.q || "").trim();
  L.origin = L.geo ? { lat:32.30, lon:-90.18, st:"MS", label:"your location (simulated)" } : null; L.msg = "";
  let list = BRANCHES.filter(b => L.st === "All" || b.st === L.st);
  if (q && !L.geo) {
    const low = q.toLowerCase();
    if (/^\d{5}$/.test(q)) {
      const z = +q.slice(0,3); const hit = ZIP3.find(r => z >= r[0] && z <= r[1]);
      if (hit) L.origin = { lat:hit[3], lon:hit[4], st:hit[2], label:`ZIP ${q}` };
      else { L.msg = `We don't have a branch near ZIP ${esc(q)} yet. Our branches are in TX, LA, MS, AL, TN, OK and AZ.`; list = []; }
    } else {
      const city = BRANCHES.find(b => b.city.toLowerCase() === low || bname(b).toLowerCase() === low) || BRANCHES.find(b => b.city.toLowerCase().startsWith(low));
      const st = Object.entries(STATES).find(([k,v]) => k.toLowerCase() === low || v.toLowerCase() === low);
      if (city) L.origin = { lat:city.lat, lon:city.lon, st:city.st, label:bname(city) };
      else if (st) list = list.filter(b => b.st === st[0]);
      else { L.msg = `No branches match "${esc(q)}". Try a ZIP code, city or state.`; list = []; }
    }
  }
  if (L.origin) list = list.map(b => ({ ...b, d: dist([L.origin.lat,L.origin.lon],[b.lat,b.lon]) })).sort((a,c) => a.d - c.d);
  return list;
}

  const st = S.ca.step, done = S.ca.sent, v = S.vals;
  const steps = `<ol class="steps">${CA.map((s,i)=>`<li class="${done?'done':i===st?'on':i<st?'done':''}" ${i===st&&!done?'aria-current="step"':''}><b>STEP ${i+1} OF ${CA.length}</b>${s}</li>`).join("")}</ol>`;
  const panels = [
    () => `${fld("c-legal","Legal business name",{req:true,full:true,attrs:'autocomplete="organization"'})}${fld("c-dba","DBA (if different)")}${fld("c-type","Business type",{req:true,options:["","LLC","Corporation","Sole proprietor","Partnership"]})}
      ${fld("c-ein","Federal tax ID (EIN)",{req:true,hint:"Format XX-XXXXXXX",attrs:'inputmode="numeric"'})}${fld("c-lic","State HVAC license #",{req:true})}
      ${fld("c-addr","Business street address",{req:true,full:true,attrs:'autocomplete="street-address"'})}${fld("c-city","City",{req:true})}${fld("c-zip","ZIP",{req:true,attrs:'inputmode="numeric" autocomplete="postal-code"'})}

      ${chk("c-tax","This business is tax exempt",{rerender:true})}${v["c-tax"]?fld("c-cert","Resale or exemption certificate",{type:"file",req:true,full:true}):""}`,
    () => `<h2 class="h4 full">Owner or principal</h2>${fld("o1-n","Full name",{req:true,attrs:'autocomplete="name"'})}${fld("o1-t","Title",{req:true})}${fld("o1-e","Email",{req:true,type:"email"})}${fld("o1-p","Phone",{req:true,type:"tel"})}
      <div class="full card flat stack">${pin(3)}<h2 class="h4">Personal guarantee</h2><p class="small muted">Most credit accounts need a personal guarantor. This information is encrypted and used only for the credit check.</p>
      <div class="form-grid">${fld("g-n","Guarantor full name",{req:true})}${fld("g-ssn","Social Security number",{req:true,type:"password",hint:"Encrypted · used only for the credit check",attrs:'inputmode="numeric" autocomplete="off"'})}
      ${fld("g-addr","Home street address",{req:true,full:true})}${fld("g-city","City",{req:true})}${fld("g-zip","ZIP",{req:true,attrs:'inputmode="numeric"'})}
      ${chk("g-consent","I authorize Jackson Supply to get a personal credit report for this application.",{req:true})}</div></div>
      <button class="btn sm ghost full" type="button" style="justify-self:start" data-act="addowner">+ Add Another Owner</button>`,
    () => `<h2 class="h4 full">Bank reference</h2>${fld("b-n","Bank name",{req:true})}${fld("b-p","Bank phone",{req:true,type:"tel"})}
      ${[1,2,3].map(n=>`<h2 class="h4 full" style="margin-top:8px">Trade reference ${n}${n>1?" (optional)":""}</h2>${fld(`t${n}-n`,"Supplier name",{req:n===1})}${fld(`t${n}-p`,"Phone or email",{req:n===1})}`).join("")}`,
    () => `<div class="full card flat stack"><h2 class="h4">Review</h2>
        <dl class="g2 small" style="margin:0">${[["Business",v["c-legal"]||"Not entered",0],["Tax ID",v["c-ein"]||"Not entered",0],["Owner",v["o1-n"]||"Not entered",1],["Guarantor",v["g-n"]||"Not entered",1],["Bank",v["b-n"]||"Not entered",2],["Trade references",[1,2,3].filter(n=>v[`t${n}-n`]).length+" provided",2]].map(([k,val,s])=>`<div class="kv"><dt>${k}</dt><dd>${esc(val)} <button type="button" class="link small" data-castep="${s}">Edit<span class="sr"> ${k}</span></button></dd></div>`).join("")}</dl></div>
      <div class="full card flat" style="max-height:160px;overflow:auto"><h2 class="h4">Terms of credit</h2>${lines(6)}</div>

      ${fld("s-n","Signer full name",{req:true})}${fld("s-t","Title",{req:true})}
      <div class="field full">${pin(4)}<span class="lbl">Signature</span>

        ${S.sigMode==="type" ? `<div class="typed-sig" aria-hidden="true">${esc(v["s-n"]||"Your name")}</div><span class="hint">Your typed name above is your legal signature. Dated ${new Date().toLocaleDateString()}.</span>`

  </div></section>
  <section class="sec tight"><div class="wrap stack">${pin(2)}<h2 class="h3" id="quotes" tabindex="-1">Quote requests</h2><div class="tbl-wrap"><table class="data"><thead><tr><th scope="col">Request</th><th scope="col">Branch</th><th scope="col">Sent</th><th scope="col">Status</th></tr></thead><tbody>
    ${[["Smith job: 3 ton heat pump system","Waiting on branch","warn"],["Daikin 12k mini-split ×4","Quoted · call to order","ok"],["Commercial RTU replacement","Closed",""]].map(([n,s,c])=>`<tr><td><b>${n}</b></td><td>${b?b.city:"Not set"}</td><td class="num">MM/DD</td><td><span class="tag ${c}">${s}</span></td></tr>`).join("")}</tbody></table></div><p class="small muted">Quotes come back from your branch by email or phone. To order, call your branch or stop by the counter.</p></div></section>
  <section class="sec tight"><div class="wrap stack">${pin(3)}<h2 class="h3">Recent invoices</h2><div class="tbl-wrap"><table class="data"><thead><tr><th scope="col">Invoice</th><th scope="col">Date</th><th scope="col">Amount</th><th scope="col">Status</th></tr></thead><tbody>
    ${[["INV-00481","Paid","ok"],["INV-00476","Due MM/DD","warn"],["INV-00470","Paid","ok"]].map(([n,s,c],i)=>`<tr><td class="mono">${n}</td><td class="num">MM/DD</td><td class="num">$${(1240+i*311).toLocaleString()}.00</td><td><span class="tag ${c}">${s}</span></td></tr>`).join("")}</tbody></table></div><div>${portalLink("btn sm","Pay or View All in Payment Portal")}</div></div></section>
  <section class="sec tight"><div class="wrap g2"><div class="card stack"><h2 class="h3">Company users</h2><p class="small muted">Admins can invite techs and choose who sees pricing.</p><button type="button" class="btn sm" style="justify-self:start" data-act="invite">Invite a User</button></div><div class="card stack"><h2 class="h3">Profile &amp; security</h2><p class="small muted">Email, password and notification settings.</p><button type="button" class="btn sm" style="justify-self:start" data-act="logout">Log Out</button></div></div></section>`;
};
N.account = [["New: My Account","WordPress member area. No online ordering (client decision, 11/17), so there's no cart or order history. Guests see a log-in prompt here.","#2"],["Quote requests","Read-only list of quotes sent from product pages, the System Builder and the contact form. Branches reply by email or phone.","#2"],["Invoices","A read-only summary; payments still happen in the external portal.",""]];
EV.account = ["portal_click","user_invite","call_to_order_click"];

P.legal = () => `${crumbs("Legal")}${pagehead("Legal","Privacy Policy","Template for the Privacy Policy, Terms of Sale and Accessibility Statement.","",1)}<section class="sec"><div class="wrap article">${lines(6)}<h2 class="h3">Section heading</h2>${lines(5)}<h2 class="h3">Accessibility</h2><p class="muted">Statement of WCAG 2.2 AA conformance and a way to report barriers.</p></div></section>`;
N.legal = [["New: Legal template","Footer legal links went to the homepage in v1.","#15"]];
EV.legal = [];

/* ================= Render ================= */
const site = $("#site"), rail = $("#rail");
function render() {
  const r = P[S.route] ? S.route : "home";
  site.classList.toggle("menu-open", S.nav);
  site.innerHTML = header() + `<main id="main" tabindex="-1">${P[r]()}</main>` + footer() + dock();
  const notes = N[r] || [];
  rail.innerHTML = `<h2>Annotations</h2><p class="pg">${LABEL[r]}</p><p class="tpl">#${r} · ${S.loggedIn?"logged in":"guest"} · branch: ${myB()?bname(myB()):"not set"}</p>
    <ol>${notes.map((n,i)=>`<li><span class="pin">${i+1}</span><div><b>${n[0]}</b><span>${n[1]}</span>${n[2]?`<span class="refs">Review ${n[2]}</span>`:""}</div></li>`).join("")}</ol>
    ${(EV[r]||[]).length?`<h3>GA4 events</h3><div class="ev">${EV[r].map(e=>`<code>${e}</code>`).join("")}</div>`:""}
    <div class="legend">Wireframe only, grayscale on purpose. [Brackets] = client to supply. Branch cities and 555-01xx phone numbers are sample data. "Review #" refers to the UX review.</div>`;
  $("#devRoute").textContent = "#" + r;
  $("#pagePick").value = r;
  if (r === "credit-app" && S.sigMode === "draw" && !S.ca.sent) initSig();
}
function go(route, focus) {
  if (route !== S.route) clearErr();
  S.route = route; S.nav = false; S.filterOpen = false;
  render();
  const top = $("#device").getBoundingClientRect().top + window.scrollY - 70;
  window.scrollTo({ top: Math.max(0, top) });
  if (focus) { const h = $("#main h1") || $("#main h2"); if (h) { h.setAttribute("tabindex","-1"); h.focus({ preventScroll:true }); } }
}
function setLogged(v) { S.loggedIn = v; $("#sIn").setAttribute("aria-pressed", v); $("#sOut").setAttribute("aria-pressed", !v); render(); }
function initSig() {
  const c = $("#sig"); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const ctx = c.getContext("2d"); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = "#16191d";
  let down = false;
  const p = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.addEventListener("pointerdown", e => { down = true; c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...p(e)); });
  c.addEventListener("pointermove", e => { if (!down) return; ctx.lineTo(...p(e)); ctx.stroke(); });
  c.addEventListener("pointerup", () => down = false);
  c.addEventListener("pointercancel", () => down = false);
}
function closeMenus(except) {
  site.querySelectorAll(".nav .item.open").forEach(li => { if (li !== except) { li.classList.remove("open"); li.querySelector("[data-menu]")?.setAttribute("aria-expanded","false"); } });
}
function nav(route) { if (location.hash === "#" + route) go(route, true); else location.hash = route; }

/* ================= Events ================= */
document.addEventListener("click", e => {
  if (!e.target.closest(".site")) return;
  const m = e.target.closest("[data-menu]");
  if (m) { const li = m.parentElement, open = !li.classList.contains("open"); closeMenus(li); li.classList.toggle("open", open); m.setAttribute("aria-expanded", String(open)); return; }
  if (!e.target.closest(".nav .menu")) closeMenus();
  const t = e.target.closest("[data-act],[data-branch],[data-pick],[data-state],[data-stfilter],[data-sb],[data-sbgo],[data-brand],[data-brandfilter],[data-product],[data-q],[data-focus],[data-unfilter],[data-promocat],[data-newscat],[data-castep],[data-sig],[data-job],button[data-filter]");
  if (!t) return;
  const d = t.dataset;
  if (d.focus) { e.preventDefault(); const el = document.getElementById(d.focus) || document.getElementById(d.focus + "-0"); if (el) { if (!el.hasAttribute("tabindex") && !/^(INPUT|SELECT|TEXTAREA|BUTTON|A)$/.test(el.tagName)) el.setAttribute("tabindex","-1"); el.focus(); el.scrollIntoView({ block:"center" }); } return; }
  if (d.brand) S.brand = d.brand;
  if (d.brandfilter) { S.fKind = "equipment"; S.f = { brands:[d.brandfilter], stock:false, tons:[] }; }
  if (d.product) S.product = +d.product;
  if (d.state) S.state = d.state;
  if (d.job) { S.vals["a-pos"] = d.job; S.vals["a-br"] = d.jobbr; }
  if (d.branch != null) S.view = +d.branch;
  if ((d.branch != null || d.brand || d.product || d.state || d.brandfilter || d.job) && !d.act) { const href = t.getAttribute("href"); if (href && href.length > 1) { e.preventDefault(); nav(href.slice(1)); return; } }
  if (d.pick != null && !d.act && !e.target.closest("a,button")) { S.view = +d.pick; render(); return; }
  if (d.stfilter) { S.loc = { q:"", st:d.stfilter, geo:false }; render(); return; }
  if (d.sb != null) { S.sb.a[S.sb.step] = +d.sb; render(); return; }
  if (d.sbgo != null) { S.sb.step = +d.sbgo; render(); return; }
  if (d.q) { S.q = d.q; render(); return; }
  if (d.unfilter) { const k = d.unfilter, v = t.value; if (k === "brand") S.f.brands = S.f.brands.filter(x=>x!==v); if (k === "tons") S.f.tons = S.f.tons.filter(x=>x!==v); if (k === "stock") S.f.stock = false; render(); return; }
  if (t.matches("button[data-filter]")) { const v = t.value; S.f.tons = S.f.tons.includes(v) ? S.f.tons.filter(x=>x!==v) : [...S.f.tons, v]; render(); return; }
  if (d.promocat) { S.promoCat = d.promocat; if (d.promocat === "All") S.promoLocal = false; render(); return; }
  if (d.newscat) { S.newsCat = d.newscat; render(); return; }
  if (d.castep != null) { S.ca.step = +d.castep; clearErr(); render(); return; }
  if (d.sig) { S.sigMode = d.sig; render(); return; }
  const a = d.act; if (!a) return;
  if (t.tagName === "A" && (a === "portal" || a === "gate" || t.getAttribute("href") === "#")) e.preventDefault();
  if (a === "menu") { S.nav = !S.nav; site.classList.toggle("menu-open", S.nav); t.setAttribute("aria-expanded", String(S.nav)); }
  else if (a === "logout") { e.preventDefault(); setLogged(false); nav("home"); }
  else if (a === "portal") toast("External link: the payment portal opens in a new tab");
  else if (a === "gate") { S.returnTo = S.route; nav("login"); }
  else if (a === "quotereq") { const it = ITEMS[+d.id]; S.vals["ct-topic"] = "Equipment quote"; S.vals["ct-m"] = `Please quote: ${it.title} (${it.brand} ${it.model}). Qty: ${$("#qty")?.value || 1}.`; S.sent.contact = false; nav("contact"); }
  else if (a === "geo") { S.loc = { q:"", st:"All", geo:true }; toast("Simulated location: Jackson, MS area"); if (S.route !== "locations") nav("locations"); else render(); }
  else if (a === "demozip") { S.loc = { q:"75701", st:"All", geo:false }; render(); }
  else if (a === "locclear") { S.loc = { q:"", st:"All", geo:false }; render(); }
  else if (a === "mybranch") { const bi = +d.b; S.my = S.my === bi ? null : bi; store.set("jsc-my", S.my == null ? "" : String(S.my)); toast(S.my == null ? "My branch cleared" : "My branch set to " + bname(BRANCHES[S.my])); render(); }
  else if (a === "filters") { S.filterOpen = !S.filterOpen; render(); }
  else if (a === "clearf") { S.f = { brands:[], stock:false, tons:[] }; render(); }
  else if (a === "more") toast("Loads the next 24 results (prototype)");
  else if (a === "sb-next") { S.sb.step++; render(); }
  else if (a === "sb-back") { S.sb.step = Math.max(0, S.sb.step - 1); render(); }
  else if (a === "sb-reset") { S.sb = { step:0, a:{} }; render(); }
  else if (a === "sbquote") { e.preventDefault(); S.vals["ct-topic"] = "Equipment quote"; S.vals["ct-m"] = "Please quote the system I built in the System Builder: [system summary]."; S.sent.contact = false; nav("contact"); }
  else if (a === "sb-save") toast("System saved to My Account (prototype)");
  else if (a === "ca-back") { S.ca.step = Math.max(0, S.ca.step - 1); clearErr(); render(); }
  else if (a === "ca-save") toast("We emailed you a secure link to finish later (prototype)");
  else if (a === "ca-fill") { Object.assign(S.vals, { "c-legal":"ABC Mechanical LLC","c-type":"LLC","c-ein":"12-3456789","c-lic":"HVAC-000000","c-addr":"100 Main St","c-city":"Tyler","c-zip":"75701","c-yrs":"12","o1-n":"Alex Morgan","o1-t":"Owner","o1-e":"alex@abcmechanical.com","o1-p":"555-010-0199","g-n":"Alex Morgan","g-ssn":"000000000","g-addr":"200 Oak St","g-city":"Tyler","g-zip":"75703","g-consent":true,"b-n":"[Bank name]","b-p":"555-010-0198","t1-n":"[Supplier]","t1-p":"555-010-0197","s-n":"Alex Morgan","s-t":"Owner","s-terms":true }); clearErr(); render(); }
  else if (a === "sig-clear") { const c = $("#sig"); c.getContext("2d").clearRect(0,0,c.width,c.height); }
  else if (a === "promolocal") { S.promoLocal = !S.promoLocal; render(); }
  else if (a === "copylink") toast("Link copied (prototype)");
  else if (a === "share") toast("Opens the share dialog (prototype)");
  else if (a === "addowner") toast("Adds another owner block (prototype)");
  else if (a === "invite") toast("Opens the invite form (prototype)");
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const open = site.querySelector(".nav .item.open");
  if (open) { closeMenus(); open.querySelector("[data-menu]")?.focus(); }
});
document.addEventListener("change", e => {
  const el = e.target; if (!el.closest || !el.closest(".site")) return;
  if (el.matches("input[data-filter]")) {
    if (el.dataset.filter === "stock") S.f.stock = el.checked;
    if (el.dataset.filter === "brand") S.f.brands = el.checked ? [...S.f.brands, el.value] : S.f.brands.filter(x=>x!==el.value);
    render(); return;
  }
  if (el.type === "radio" && el.name) S.vals[el.name] = el.value;
  else if (el.id && el.type === "checkbox") S.vals[el.id] = el.checked;
  else if (el.id && el.tagName === "SELECT") S.vals[el.id] = el.value;
  if (el.hasAttribute("data-rerender")) { clearErr(); render(); }
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.closest || !el.closest(".site form") || !el.id || ["checkbox","file","radio"].includes(el.type)) return;
  S.vals[el.id] = el.value;
  if (el.id === "s-n") { const p = $(".typed-sig"); if (p) p.textContent = el.value || "Your name"; }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form;
  if (k === "search") { S.q = $("#gq").value || ""; nav("search"); return; }
  if (k === "docsearch") { toast("Filters the document list (prototype)"); return; }
  if (k === "finder") { S.loc = { q: $("#fq").value, st:"All", geo:false }; nav("locations"); return; }
  if (k === "loc") { S.loc = { q: $("#locq").value, st:"All", geo:false }; render(); $("#locq")?.focus(); return; }
  if (k === "login") { const back = S.returnTo; S.returnTo = null; setLogged(true); toast("Logged in as ABC Mechanical (demo)"); nav(back || "account"); return; }
  const ok = validate(f, k);
  if (!ok) { render(); $("#errsum")?.focus(); return; }
  if (k === "credit") {
    if (S.ca.step < CA.length - 1) { S.ca.step++; clearErr(); render(); $("#main")?.scrollIntoView(); }
    else { S.ca.sent = true; clearErr(); render(); }
    return;
  }
  S.sent[k] = true; clearErr(); render();
});

let toastT;
function toast(msg) {
  let el = $("#toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.setAttribute("role","status");
    el.style.cssText = "position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16191d;color:#fff;font:500 13px var(--mono);padding:10px 16px;border-radius:6px;z-index:80;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)";
    document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2800);
}

/* prototype chrome */
const pick = $("#pagePick");
pick.setAttribute("aria-label", "Jump to page");
pick.innerHTML = PAGES.map(([g, list]) => `<optgroup label="${g}">${list.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</optgroup>`).join("");
pick.addEventListener("change", () => nav(pick.value));
function setDevice(m) {
  $("#device").classList.toggle("mobile", m);
  $("#vMob").setAttribute("aria-pressed", m); $("#vDesk").setAttribute("aria-pressed", !m);
  $("#devName").textContent = m ? "Mobile · 390" : "Desktop · 1280";
  store.set("jsc-dev", m ? "m" : "d");
}
$("#vDesk").onclick = () => setDevice(false);
$("#vMob").onclick = () => setDevice(true);
$("#sIn").onclick = () => setLogged(true);
$("#sOut").onclick = () => setLogged(false);
$("#notesTog").addEventListener("change", e => { $("#proto").classList.toggle("no-notes", !e.target.checked); $("#proto").classList.toggle("no-pins", !e.target.checked); });

const my = store.get("jsc-my"); if (my && BRANCHES[+my]) { S.my = +my; S.view = +my; }
if (store.get("jsc-dev") === "m") setDevice(true);
let first = true;
function fromHash() {
  const h = location.hash.replace("#","");
  if (h && !P[h]) return;
  go(h || "home", !first); first = false;
}
window.addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
